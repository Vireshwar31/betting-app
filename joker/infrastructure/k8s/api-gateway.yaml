apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: betting-platform-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/auth-jwt: "true"
spec:
  rules:
  - host: api.bettingplatform.com
    http:
      paths:
      - path: /odds
        pathType: Prefix
        backend:
          service:
            name: odds-engine-service
            port:
              number: 8080
      - path: /wallet
        pathType: Prefix
        backend:
          service:
            name: wallet-service
            port:
              number: 8081
      - path: /risk
        pathType: Prefix
        backend:
          service:
            name: risk-management-service
            port:
              number: 8082